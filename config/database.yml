
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: postgres
  password: karen0407


development:
  pato_branco: 
    <<: *default
    database: pato_branco_development
  joacaba:
    <<: *default
    database: joacaba_development


test:
  <<: *default
  database: ministerio_saude_api_test

production:
  primary: &primary_production
    <<: *default
    database: ministerio_saude_api_production
    username: ministerio_saude_api
    password: <%= ENV["MINISTERIO_SAUDE_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: ministerio_saude_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ministerio_saude_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ministerio_saude_api_production_cable
    migrations_paths: db/cable_migrate
